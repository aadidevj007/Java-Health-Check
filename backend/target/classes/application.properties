spring.application.name=java-health-monitor
server.address=0.0.0.0
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/healthmonitor}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:healthmonitor}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:healthmonitor}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.db.enabled=true
