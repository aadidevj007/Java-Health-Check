services:
  postgres:
    image: postgres:16-alpine
    container_name: java-health-monitor-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthmonitor}
      POSTGRES_USER: ${POSTGRES_USER:-healthmonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthmonitor}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [monitor-net]

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: java-health-monitor-app:latest
    container_name: java-health-monitor-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-healthmonitor}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-healthmonitor}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-healthmonitor}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 3
    networks: [monitor-net]
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: java-health-monitor-frontend:latest
    container_name: java-health-monitor-frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "3000:80"
    networks: [monitor-net]
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  monitor-net:
    name: java-health-monitor
